  card.innerHTML = `
    <h3>${c.name} <span class="badge" style="background:${c.color}">누적 ${c.total}m</span></h3>
    <div class="course-note">${c.note} · 그래프 최고점 ${peakM}m</div>
    <canvas id="chart${idx}"></canvas>
  `;
  courseListEl.appendChild(card);
});

courses.forEach((c, idx) => {
  const ctx = document.getElementById('chart'+idx).getContext('2d');
  const points = c.km.map((k,i) => ({x:k, y:c.m[i]}));
  const courseMax = c.km[c.km.length-1];
  new Chart(ctx, {
    type:'line',
    data: {
      datasets: [{
        data: points,
        borderColor: c.color,
        backgroundColor: c.color + '33',
        borderWidth: 2,
        pointRadius: 0,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {

      maintainAspectRatio:false,
